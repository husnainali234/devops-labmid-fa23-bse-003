<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Submission Portal - Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; }
    #errors { color: #b00020; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .4rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Assignment Submission Portal (static demo)</h1>
  <p>This GitHub Pages demo runs in your browser only; submissions are not stored on a server.</p>
  <form id="f">
    <label>Name <input id="name"></label>
    <label>Registration number <input id="reg_no"></label>
    <label>Assignment title <input id="title"></label>
    <label>Submission URL <input id="url"></label>
    <button type="submit">Submit</button>
  </form>
  <ul id="errors"></ul>
  <h2>Submissions (this session)</h2>
  <table id="t"><tr><th>Name</th><th>Reg. No.</th><th>Title</th><th>URL</th></tr></table>
  <script>
    const labels = { name: "Name", reg_no: "Registration number", title: "Assignment title", url: "Submission URL" };
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = {}, errs = [];
      for (const k in labels) {
        v[k] = document.getElementById(k).value.trim();
        if (!v[k]) errs.push(labels[k] + " is required");
      }
      if (v.url) { try { const u = new URL(v.url); if (!/^https?:$/.test(u.protocol)) throw 0; } catch { errs.push("Submission URL is invalid"); } }
      const box = document.getElementById("errors");
      box.replaceChildren(...errs.map(m => Object.assign(document.createElement("li"), { textContent: m })));
      if (errs.length) return;
      const tr = document.createElement("tr");
      for (const k in labels) tr.appendChild(Object.assign(document.createElement("td"), { textContent: v[k] }));
      document.getElementById("t").appendChild(tr);
      e.target.reset();
    });
  </script>
</body>
</html>
